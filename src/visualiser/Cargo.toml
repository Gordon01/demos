[package]
name = "visualiser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A frequency-band audio visualiser"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
  "default_fonts",
  "glow",
] }
rfd = "0.17"
rodio = "0.23"
rustfft = "6.4"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
  "wayland",
  "x11",
] }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.29", default-features = false, features = [
  "core_audio",
  "dispatch",
  "macos_14_2",
] }
